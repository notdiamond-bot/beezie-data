name: collect

on:
  schedule:
    - cron: '*/5  * * * *'
  workflow_dispatch:

permissions:
  contents: write

# One at a time, so two runs never write the same file.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # The branch's newest commit, not the one current when this run was queued:
      # a run that waited behind another would otherwise start from data already
      # replaced, and its save would clash with the newer state files.
      - uses: actions/checkout@v5
        with:
          ref: main
      # What players actually paid (promos, free plays, Beezie credits), read from
      # Solana, for the Claw Log's labels. Read now, then again every PAID_EVERY_S (30)
      # seconds in the background for as long as the summaries step takes (it can
      # be minutes), publishing to the `paid` branch each time: a label shows about
      # a minute after the play. Each read costs one Helius signature call, so a
      # shorter gap spends more credits. Needs the HELIUS_RPC_URL secret; without
      # it paid.mjs does nothing.
      - name: Actual prices and the Claw Log window, now and every 30 seconds
        continue-on-error: true
        timeout-minutes: 3
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          # Where a fresh start begins reading: midnight Pacific, Nov 13.
          PAID_BACKFILL_FROM: '2026-11-13T08:00:00Z'
          PAID_EVERY_S: '30'
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node paid.mjs || true
          ./publish-paid.sh || true
          rm -f /tmp/paid-stop /tmp/paid-done
          nohup ./paid-loop.sh > /tmp/paid-loop.log 2>&1 &
      # The Data tab's numbers: counts only pulls it hasn't counted yet. A failure here
      # must not stop the counts so far being saved.
      - run: node build-stats.mjs
        continue-on-error: true
        timeout-minutes: 15
      # Stop the background reads before anything is saved, then read once more.
      - name: Actual prices, last read
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          PAID_BACKFILL_FROM: '2026-11-13T08:00:00Z'
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch /tmp/paid-stop
          for i in $(seq 1 90); do [ -f /tmp/paid-done ] && break; sleep 1; done
          cat /tmp/paid-loop.log || true
          node paid.mjs || true
          ./publish-paid.sh || true
      - name: Save
        run: |
          git config user.name "beezie-data[bot]"
          git config user.email "beezie-data@users.noreply.github.com"
          git add kv
          if git diff --cached --quiet; then echo "nothing new"; else
            git commit -m "counts $(date -u +%Y-%m-%dT%H:%MZ)"
            # Should another save still have landed first, this run's state is the
            # older one: drop it (the next run reads again from the newer state).
            if git pull --rebase -q; then git push; else
              git rebase --abort
              echo "::warning::a newer save landed first; this run's counts are skipped"
            fi
          fi
      # The summaries go out as ONE commit on the `snapshots` branch, replaced each time,
      # so publishing them every run keeps no history and the repo stays small.
      - name: Publish snapshots
        if: hashFiles('data/summary-24h.json') != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/snap && mkdir -p /tmp/snap && cp -r data /tmp/snap/data
          cd /tmp/snap
          git init -q -b snapshots
          git config user.name "beezie-data[bot]"
          git config user.email "beezie-data@users.noreply.github.com"
          git add data
          git commit -qm "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" snapshots

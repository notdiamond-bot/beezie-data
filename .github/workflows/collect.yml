name: collect

on:
  schedule:
    - cron: '*/5  * * * *'
  workflow_dispatch:

permissions:
  contents: write

# One at a time, so two runs never write the same file.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      # What players actually paid (promos, free plays, Beezie credits), read from
      # Solana, for the Claw Log's labels. Read once a minute for the first four
      # minutes of the run and published each time to the `paid` branch, so a label
      # shows about a minute after the play instead of after the next run.
      # PAID_EVERY_S sets the pace: each read costs one Helius signature call, so
      # a shorter gap spends more credits. Needs the HELIUS_RPC_URL secret; without
      # it paid.mjs does nothing.
      - name: Actual prices, every minute
        continue-on-error: true
        timeout-minutes: 8
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          # Where a fresh start begins reading: midnight Pacific, Nov 13.
          PAID_BACKFILL_FROM: '2026-11-13T08:00:00Z'
          PAID_EVERY_S: '60'
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          start=$(date +%s)
          for i in 0 1 2 3; do
            node paid.mjs || true
            ./publish-paid.sh || true
            if [ "$i" -lt 3 ]; then
              wait=$(( start + PAID_EVERY_S * (i + 1) - $(date +%s) ))
              if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
            fi
          done
      # The Data tab's numbers: counts only pulls it hasn't counted yet. A failure here
      # must not stop the counts so far being saved.
      - run: node build-stats.mjs
        continue-on-error: true
        timeout-minutes: 15
      # One more read after the numbers, so the minute they took isn't a gap.
      - name: Actual prices, once more
        continue-on-error: true
        timeout-minutes: 3
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          PAID_BACKFILL_FROM: '2026-11-13T08:00:00Z'
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node paid.mjs || true
          ./publish-paid.sh || true
      - name: Save
        run: |
          git config user.name "beezie-data[bot]"
          git config user.email "beezie-data@users.noreply.github.com"
          git add kv
          if git diff --cached --quiet; then echo "nothing new"; else
            git commit -m "counts $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q || true
            git push
          fi
      # The summaries go out as ONE commit on the `snapshots` branch, replaced each time,
      # so publishing them every run keeps no history and the repo stays small.
      - name: Publish snapshots
        if: hashFiles('data/summary-24h.json') != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/snap && mkdir -p /tmp/snap && cp -r data /tmp/snap/data
          cd /tmp/snap
          git init -q -b snapshots
          git config user.name "beezie-data[bot]"
          git config user.email "beezie-data@users.noreply.github.com"
          git add data
          git commit -qm "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" snapshots
